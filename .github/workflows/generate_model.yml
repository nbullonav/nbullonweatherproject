name: Generate ML Model

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-test:
    runs-on: ubuntu-latest

    strategy:
      max-parallel: 1
      matrix:
        station: ["84370", "84401", "84501"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install -r requirements_model.txt

      - name: Run model script (forecast + test + enso)
        env:
          STATION_ID: ${{ matrix.station }}
        run: |
          python modeloML.py

      - name: Upload ENSO scenario artifacts
        uses: actions/upload-artifact@v4
        with:
          name: enso_${{ matrix.station }}
          path: data/pred_${{ matrix.station }}_*.csv

      - name: Upload Model comparison artifact
        uses: actions/upload-artifact@v4
        with:
          name: pred_${{ matrix.station }}
          path: data/pred_${{ matrix.station }}.csv

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: testsets_${{ matrix.station }}
          path: data/test_metrics/testsets_${{ matrix.station }}.csv

      - name: Commit CSV to repo
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add data/
          git commit -m "Update csv for station ${{ matrix.station}}" || true
          git pull --rebase origin generate_model
          git push
          
